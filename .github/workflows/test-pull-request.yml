name: Test Pull Request

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.x

      - name: Restore dependencies
        run: dotnet restore DrewSoft.Collections.sln

      - name: Build solution
        run: dotnet build DrewSoft.Collections.sln --configuration Release --no-restore

      - name: Run tests
        run: dotnet test DrewSoft.Collections.sln --configuration Release --no-build --verbosity minimal
